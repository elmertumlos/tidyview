<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tidyview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/m3.css">
  <style>__THEME_CSS__</style>
  <style id="tv-dynamic-theme"></style>
</head>
<body>

<!-- top app bar -->
<div class="tv-topbar">
  <div class="tv-topbar-brand">
      <div class="tv-topbar-logo">
        <div class="tv-topbar-logo-name">tidyview</div>
        <div class="tv-topbar-logo-version">v__VERSION__</div>
      </div>
  </div>
  <div class="tv-topbar-source" id="session-tab-bar">
    <!-- session tabs rendered by JS -->
  </div>
  <div class="tv-topbar-actions">
    <div class="tv-busy-indicator" id="tv-busy-indicator" style="display:none" aria-live="polite">
      <span class="tv-busy-spinner" aria-hidden="true"></span>
      <span class="tv-busy-text" id="tv-busy-text">working...</span>
    </div>
    <button class="tv-icon-btn" title="undo" onclick="TV.undo && TV.undo()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 9a5 5 0 115 5H7" stroke-linecap="round"/>
        <path d="M4 6v3h3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="tv-icon-btn" title="help" onclick="TV.openPanel('help')">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="9" cy="9" r="7"/>
        <path d="M7.8 6.8a1.6 1.6 0 113 1c0 1.1-1.2 1.5-1.8 2.1-.3.3-.5.7-.5 1.1" stroke-linecap="round"/>
        <circle cx="9" cy="12.8" r=".7" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="tv-icon-btn" title="settings" onclick="TV.openPanel('settings')">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="9" cy="9" r="2.5"/>
        <path d="M9 2v2M9 14v2M2 9h2M14 9h2M4.1 4.1l1.4 1.4M12.5 12.5l1.4 1.4M4.1 13.9l1.4-1.4M12.5 5.5l1.4-1.4"/>
      </svg>
    </button>
  </div>
</div>

<!-- workspace -->
<div class="tv-workspace">

  <!-- nav rail -->
  <nav class="tv-nav">
    <div class="tv-nav-group-label">start</div>

    <button class="tv-nav-item" data-panel="load">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10 13V5M7 8l3-3 3 3" stroke-linecap="round"/>
        <path d="M4 15h12" stroke-linecap="round"/>
      </svg>
      load
    </button>

    <button class="tv-nav-item" data-panel="columns">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="14" height="14" rx="2"/>
        <line x1="3" y1="8" x2="17" y2="8"/>
        <line x1="8" y1="8" x2="8" y2="17"/>
        <line x1="13" y1="8" x2="13" y2="17"/>
      </svg>
      columns
    </button>

    <button class="tv-nav-item" data-panel="audit">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10 3l5 2v4c0 3.3-2 5.8-5 7-3-1.2-5-3.7-5-7V5l5-2z" stroke-linejoin="round"/>
        <path d="M7 9.8l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      audit
    </button>

    <button class="tv-nav-item" data-panel="missing">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10 3c2.8 3 4.8 5.6 4.8 8.3A4.8 4.8 0 1110 6.5a4.8 4.8 0 01-4.8 4.8C5.2 8.6 7.2 6 10 3z" stroke-linejoin="round"/>
      </svg>
      missing
    </button>

    <button class="tv-nav-item" data-panel="validate">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10 3l5 2v4c0 3.3-2 5.8-5 7-3-1.2-5-3.7-5-7V5l5-2z" stroke-linejoin="round"/>
        <path d="M7 10h6M10 7v6" stroke-linecap="round"/>
      </svg>
      validate
    </button>

    <button class="tv-nav-item" data-panel="compare">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="5" height="12" rx="1.5"/>
        <rect x="12" y="4" width="5" height="12" rx="1.5"/>
        <path d="M8 8h4M8 12h4" stroke-linecap="round"/>
      </svg>
      compare
    </button>

    <div class="tv-nav-divider"></div>
    <div class="tv-nav-group-label">clean</div>

    <button class="tv-nav-item" data-panel="filter">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 6h14M6 10h8M9 14h2" stroke-linecap="round"/>
      </svg>
      filter
    </button>

    <button class="tv-nav-item" data-panel="select">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="14" height="14" rx="2"/>
        <line x1="3" y1="8" x2="17" y2="8"/>
        <line x1="8" y1="8" x2="8" y2="17"/>
      </svg>
      select
    </button>

    <button class="tv-nav-item" data-panel="relocate">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 6h5M4 10h12M4 14h8" stroke-linecap="round"/>
        <path d="M14 6l2-2M16 4l2 2M16 4v7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      relocate
    </button>

    <button class="tv-nav-item" data-panel="mutate">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="10" y1="4" x2="10" y2="16"/>
        <line x1="4" y1="10" x2="16" y2="10"/>
      </svg>
      mutate
    </button>

    <button class="tv-nav-item" data-panel="recode">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M5 7h6M5 10h4M5 13h5" stroke-linecap="round"/>
        <path d="M13 9l2 2-2 2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 11h-3" stroke-linecap="round"/>
      </svg>
      recode
    </button>

    <button class="tv-nav-item" data-panel="factors">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="6" cy="6" r="2"/>
        <circle cx="6" cy="14" r="2"/>
        <circle cx="14" cy="10" r="2"/>
        <path d="M8 6h6M8 14h6M12 10h4" stroke-linecap="round"/>
      </svg>
      factors
    </button>

    <button class="tv-nav-item" data-panel="fill_na">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="14" height="14" rx="2"/>
        <path d="M7 10h6M10 7v6" stroke-linecap="round" opacity=".4"/>
        <circle cx="10" cy="10" r="2.5" fill="currentColor" opacity=".25"/>
        <path d="M8 10h4" stroke-linecap="round"/>
      </svg>
      replace_na
    </button>

    <button class="tv-nav-item" data-panel="drop_na">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 6h12M6 10h8M8 14h4" stroke-linecap="round"/>
        <path d="M13 12l3 3M16 12l-3 3" stroke-linecap="round"/>
      </svg>
      drop_na
    </button>

    <button class="tv-nav-item" data-panel="separate">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M5 5v10M15 5v10" stroke-linecap="round"/>
        <path d="M8 10h4" stroke-linecap="round"/>
        <path d="M10 7l3 3-3 3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      separate
    </button>

    <button class="tv-nav-item" data-panel="rename">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 6h12M4 10h8M4 14h5"/>
        <path d="M14 12l2 2-2 2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      rename
    </button>

    <button class="tv-nav-item" data-panel="dedupe">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="11" height="14" rx="2"/>
        <rect x="6" y="6" width="11" height="14" rx="2" fill="var(--md-surface)"/>
      </svg>
      distinct
    </button>

    <button class="tv-nav-item" data-panel="arrange">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="4" y1="6" x2="16" y2="6"/>
        <line x1="4" y1="10" x2="12" y2="10"/>
        <line x1="4" y1="14" x2="9" y2="14"/>
      </svg>
      arrange
    </button>

    <button class="tv-nav-item" data-panel="slice">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 5h14M3 10h14" stroke-linecap="round"/>
        <path d="M3 15h8" stroke-linecap="round"/>
        <path d="M14 13l3 2-3 2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      slice
    </button>

    <div class="tv-nav-divider"></div>
    <div class="tv-nav-group-label">combine</div>

    <button class="tv-nav-item" data-panel="join">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="7" cy="10" r="5"/>
        <circle cx="13" cy="10" r="5"/>
      </svg>
      join
    </button>

    <button class="tv-nav-item" data-panel="combine">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="6" height="12" rx="1.5"/>
        <rect x="11" y="4" width="6" height="12" rx="1.5"/>
        <path d="M9 10h2" stroke-linecap="round"/>
      </svg>
      combine
    </button>

    <button class="tv-nav-item" data-panel="psgc">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 6h12M4 10h12M4 14h12" stroke-linecap="round"/>
        <circle cx="6" cy="6" r="1.5"/>
        <circle cx="10" cy="10" r="1.5"/>
        <circle cx="14" cy="14" r="1.5"/>
      </svg>
      area names
    </button>

    <button class="tv-nav-item" data-panel="reshape">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 10h12M13 7l3 3-3 3M7 7L4 10l3 3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      pivot
    </button>

    <div class="tv-nav-divider"></div>
    <div class="tv-nav-group-label">report</div>

    <button class="tv-nav-item" data-panel="summarise">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="6" height="6" rx="1"/>
        <rect x="11" y="3" width="6" height="6" rx="1"/>
        <rect x="7" y="11" width="6" height="6" rx="1"/>
      </svg>
      summarise
    </button>

    <button class="tv-nav-item" data-panel="count">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 14v-3l3-3 3 3 4-5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 17h12" stroke-linecap="round"/>
      </svg>
      count
    </button>

    <button class="tv-nav-item" data-panel="tabulate">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 5h12M4 10h9M4 15h6" stroke-linecap="round"/>
        <circle cx="15" cy="15" r="2"/>
      </svg>
      tabulate
    </button>

    <button class="tv-nav-item" data-panel="crosstab">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="14" height="14" rx="2"/>
        <line x1="3" y1="8" x2="17" y2="8"/>
        <line x1="8" y1="3" x2="8" y2="17"/>
      </svg>
      crosstab
    </button>

    <button class="tv-nav-item" data-panel="plot">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 15h12" stroke-linecap="round"/>
        <path d="M5 13l3-4 3 2 4-5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="5" cy="13" r="1"/>
        <circle cx="8" cy="9" r="1"/>
        <circle cx="11" cy="11" r="1"/>
        <circle cx="15" cy="6" r="1"/>
      </svg>
      plot
    </button>

    <div class="tv-nav-divider"></div>
    <div class="tv-nav-group-label">finish</div>

    <button class="tv-nav-item" data-panel="export">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10 4v9M7 10l3 3 3-3" stroke-linecap="round"/>
        <path d="M4 15h12" stroke-linecap="round"/>
      </svg>
      export
    </button>

    <div class="tv-nav-signature">
      <div class="tv-nav-signature-name">Elmer S. Tumlos</div>
      <a class="tv-nav-signature-link" href="mailto:e.tumlos@psa.gov.ph">e.tumlos@psa.gov.ph</a>
      <div class="tv-nav-signature-version">version: __VERSION__</div>
    </div>

  </nav>

  <!-- main content -->
  <main class="tv-main">

    <div id="tv-startup-notice"></div>
    <div class="tv-busy-bar" id="tv-busy-bar" style="display:none" aria-hidden="true">
      <span class="tv-busy-bar-fill"></span>
    </div>

    <!-- table bar -->
    <div class="tv-table-bar">
      <div class="tv-dim-label" id="dim-label">no data loaded</div>
      <div class="tv-search">
        <svg class="tv-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="4.5"/>
          <line x1="10.5" y1="10.5" x2="14" y2="14"/>
        </svg>
        <input id="search-input" placeholder="search rows…">
      </div>
      <div class="tv-page-ctrl">
        <span id="page-info">–</span>
        <button class="tv-page-btn" id="prev-btn" onclick="TV.changePage(-1)" disabled>‹</button>
        <button class="tv-page-btn" id="next-btn" onclick="TV.changePage(1)" disabled>›</button>
      </div>
    </div>

    <!-- data table -->
    <div class="tv-table-wrap" id="table-wrap"></div>

    <!-- code pane -->
    <div class="tv-code-pane">
      <div class="tv-code-header">
        <span class="tv-code-label">R script</span>
        <span style="font:var(--tv-type-mono);font-size:11px;color:var(--md-on-surface-variant)" id="hist-count">0 operations</span>
        <button class="tv-code-copy" id="copy-btn" onclick="TV.copyHistory()">copy all</button>
      </div>
      <div class="tv-code-body" id="code-body">
        <span class="tv-cmt"># tidyview — operations will appear here as you work</span>
      </div>
    </div>

  </main>

  <!-- op panel (right side) -->
  <aside class="tv-panel" id="op-panel" style="display:none"></aside>

</div>

<script>
  window.__INIT_DATA__   = __INIT_DATA__;
  window.__ENV_OBJECTS__ = __ENV_OBJECTS__;
  window.__STARTUP_NOTICE__ = __STARTUP_NOTICE__;
</script>
<script src="/js/app.js"></script>
<script src="/js/ops_filter.js"></script>
<script src="/js/ops_arrange.js"></script>
<script src="/js/ops_join.js"></script>
<script src="/js/ops_combine.js"></script>
<script src="/js/ops_compare.js"></script>
<script src="/js/ops_psgc.js"></script>
<script src="/js/ops_reshape.js"></script>
<script src="/js/ops_rename_dedupe_export.js"></script>
<script src="/js/ops_extra.js"></script>
<script src="/js/ops_plot.js"></script>
<script src="/js/ops_help.js"></script>
<script src="/js/ops_audit.js"></script>
<script src="/js/ops_missing.js"></script>
<script src="/js/ops_validate.js"></script>
<script src="/js/ops_settings.js"></script>
<script src="/js/ops_recode.js"></script>
<script src="/js/ops_factors.js"></script>
<script src="/js/ops_columns.js"></script>
<script src="/js/ops_tidyverse.js"></script>

</body>
</html>
